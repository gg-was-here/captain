appId: app.captain.desktop
productName: Bambii
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
# Electron fuses, flipped in the binary at package time: the app can't be run as plain Node, ignores
# NODE_OPTIONS and --inspect, only loads its own code from the checksummed app.asar, encrypts cookies, and
# gives file:// pages no special powers (nothing is served from file://).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
protocols:
  - name: Bambii
    schemes: [captain]
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Set CSC_LINK / CSC_KEY_PASSWORD (Developer ID cert) and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID to sign + notarize.
  notarize: true
dmg:
  title: Bambii
publish:
  provider: generic
  url: ${env.CAPTAIN_UPDATES_URL}
