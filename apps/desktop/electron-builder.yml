appId: app.captain.desktop
productName: Bambii
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
protocols:
  - name: Bambii
    schemes: [captain]
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Set CSC_LINK / CSC_KEY_PASSWORD (Developer ID cert) and APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID to sign + notarize.
  notarize: true
dmg:
  title: Bambii
publish:
  provider: generic
  url: ${env.CAPTAIN_UPDATES_URL}
